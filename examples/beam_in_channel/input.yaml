units: normalized
domain: {nx: 128, ny: 32, lx_m: 2.0, ly_m: 0.5}
# A drifting electron beam confined to a channel: periodic along x, reflecting
# (PEC field + specular particle) walls in y. Exercises mixed dict-form boundaries
# with both field and particle side-maps. The beam streams along x and bounces off
# the y walls, staying confined (no particle loss).
boundary:
  field: {x_lo: periodic, x_hi: periodic, y_lo: pec, y_hi: pec}
  particle: {x_lo: periodic, x_hi: periodic, y_lo: specular, y_hi: specular}
numerics: {fdtd_order: 2, shape: cic, current_filter: []}
species:
  - name: electron_beam
    charge_C: -1
    mass_kg: 1
    n_particles: 16384
    initial:
      distribution: maxwellian_uniform
      density_per_m3: 1.0
      temperature_eV: 0.01
      drift_v: [0.3, 0.05, 0.0]
time: {dt_s: auto, steps: 256}
diagnostics: {output_path: out.npz, cadence: 8, fields: [bz], per_species: true}
