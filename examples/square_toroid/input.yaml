# Square-cross-section toroidal magnet modeled as four toroidal current sheets.
#
# Geometry:
#   R0 = 0.100000 m, square side a = 0.040000 m
#   inner radius = 0.080000 m, outer radius = 0.120000 m
#   top/bottom z = +/-0.020000 m
#
# Currents:
#   top and bottom faces carry +phi current
#   inner and outer cylindrical faces carry -phi current
#   each sheet has total current 1.000000 A
#   each sheet is represented by 16 circular-loop filaments
#
# Regenerate with:
#   python examples/square_toroid/build_yaml.py

units: SI

