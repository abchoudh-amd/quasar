# Orszag-Tang MHD vortex (Orszag & Tang, JFM 1979).
#
# The canonical 2D ideal-MHD test for the transition to MHD turbulence. A smooth
# initial vortex in a doubly-periodic unit box develops sharp current sheets and
# interacting shocks. Standard diagnostics are conserved-quantity tracking (total
# mass and total energy should be conserved to scheme tolerance over the run) and
# the well-known vortex / current-sheet morphology at t = 0.5.
#
# Standard initial condition (gamma = 5/3), on [0,1] x [0,1]:
#   rho = gamma^2,  p = gamma
#   v = (-sin(2*pi*y),  sin(2*pi*x),  0)
#   B = (-sin(2*pi*y),  sin(4*pi*x),  0)
# This is the uniformly rescaled mu0=1 form of the standard OT state.

units: normalized
domain: {nx: 128, ny: 128, lx_m: 1.0, ly_m: 1.0, origin_x_m: 0.0, origin_y_m: 0.0}
geometry: cartesian
# Numerics notes:
#  * MP5/MP7 characteristic reconstruction alone has no positivity guarantee.
#    The complete solver nevertheless preserves the mathematical admissible set
#    conservatively: it rejects and rolls back an inadmissible SSP-RK candidate,
#    then retries with smaller substeps and a piecewise-constant HLL anchor as
#    needed. It does not clamp density or re-derive energy from a pressure floor.
#  * cfl=0.1 provides accuracy and stability headroom as the current sheets
#    sharpen. The shipped 1000-step regression covers the resolved early window
#    through t~0.19, where total mass/energy are conserved to round-off and
#    div(B) is at machine epsilon. A canonical t=0.5 morphology comparison needs
#    a longer, resolution-converged run; it is not what this deck validates.
numerics: {gamma: 1.6666667, reconstruction: mp7, riemann: hlld, integrator: ssprk3,
           ct: fd_ct_christlieb, positivity: troubled_cell,
           rho_floor: 1e-8, p_floor: 1e-9, cfl: 0.1}
initial:
  type: orszag_tang
  params:
    # With rho=25/9 and p=5/3, the consistent mu0=1 normalization is B0=1.
    b0: 1.0
# steps=1000 at cfl=0.1 integrates to t~0.19, the resolved early-time window.
time: {dt_s: auto, steps: 1000, t_end: 0.2}
diagnostics: {output_path: out.npz, cadence: 0,
              fields: [rho, mx, my, mz, energy, bx, by, bz], divb: true}
boundary: {fluid: [periodic, periodic, periodic, periodic],
           field: [periodic, periodic, periodic, periodic]}
