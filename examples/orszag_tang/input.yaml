# Orszag-Tang MHD vortex (Orszag & Tang, JFM 1979).
#
# The canonical 2D ideal-MHD test for the transition to MHD turbulence. A smooth
# initial vortex in a doubly-periodic unit box develops sharp current sheets and
# interacting shocks. Standard diagnostics are conserved-quantity tracking (total
# mass and total energy should be conserved to scheme tolerance over the run) and
# the well-known vortex / current-sheet morphology at t = 0.5.
#
# Standard initial condition (gamma = 5/3), on [0,1] x [0,1]:
#   rho = gamma^2,  p = gamma
#   v = (-sin(2*pi*y),  sin(2*pi*x),  0)
#   B = (-sin(2*pi*y),  sin(4*pi*x),  0) / sqrt(4*pi)
# (the standard OT magnetic normalization with B0 = 1/sqrt(4*pi)).

units: normalized
domain: {nx: 128, ny: 128, lx_m: 1.0, ly_m: 1.0, origin_x_m: 0.0, origin_y_m: 0.0}
geometry: cartesian
numerics: {gamma: 1.6666667, reconstruction: mp7, riemann: hlld, integrator: ssprk3,
           ct: fd_ct_christlieb, positivity: troubled_cell, rho_floor: 1e-8, p_floor: 1e-9, cfl: 0.4}
initial:
  type: orszag_tang
  params:
    # gamma-derived ambient state and B normalization are computed by the IC
    # generator from numerics.gamma; b0 = 1/sqrt(4*pi) is the standard OT value.
    b0: 0.2820947918    # 1 / sqrt(4*pi)
time: {dt_s: auto, steps: 4000, t_end: 0.5}
diagnostics: {output_path: out.npz, cadence: 0,
              fields: [rho, mx, my, mz, energy, bx, by, bz], divb: true}
boundary: {fluid: [periodic, periodic, periodic, periodic],
           field: [periodic, periodic, periodic, periodic]}
