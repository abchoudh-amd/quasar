# MHD rotor (Balsara & Spicer 1999; Toth 2000).
#
# A dense, rapidly-rotating disk embedded in a static, uniformly-magnetized
# ambient medium. As the disk spins it winds up the threaded field, launching
# strong TORSIONAL ALFVEN WAVES that carry angular momentum outward and brake the
# rotor. The wound-up field compresses the central disk into an oblate shape. This
# is the standard test for a scheme's handling of rotational discontinuities and
# strong torsional Alfven waves, and a positivity stress test in the low-density
# rarefied wake.
#
# Standard setup (gamma = 1.4), on [0,1] x [0,1], rotor centered at (0.5, 0.5):
#   r0 = 0.1 (disk radius), r1 = 0.115 (taper to ambient)
#   inside  (r < r0):  rho = 10, v = omega * (-(y-0.5), (x-0.5), 0),  omega = u0/r0
#   outside (r > r1):  rho = 1,  v = 0
#   taper   (r0<r<r1): rho = 1+9f and v_phi = f*u0, f = (r1-r)/(r1-r0)
#   everywhere: p = 1, B = (5/sqrt(4*pi), 0, 0)
#   u0 = 2 (rim speed), so omega = 20.

units: normalized
domain: {nx: 128, ny: 128, lx_m: 1.0, ly_m: 1.0, origin_x_m: 0.0, origin_y_m: 0.0}
geometry: cartesian
# cfl=0.2 provides accuracy and stability headroom for this severe transient.
# MP7 reconstruction alone has no positivity guarantee, but the complete solver
# discards an inadmissible SSP-RK candidate, restores the conservative state, and
# retries with smaller substeps and a piecewise-constant HLL anchor as needed; it
# does not repair pressure by injecting energy. The rotor's div(B) is at machine
# epsilon RELATIVE to the field; its absolute divb_linf is dominated by
# telescoping round-off that grows with the 4000-step count.
numerics: {gamma: 1.4, reconstruction: mp7, riemann: hlld, integrator: ssprk3,
           ct: fd_ct_christlieb, positivity: troubled_cell, rho_floor: 1e-8, p_floor: 1e-9, cfl: 0.2}
initial:
  type: rotor
  params:
    center: [0.5, 0.5]
    r0: 0.1            # disk radius
    r1: 0.115          # outer edge of the linear taper region
    rho_in: 10.0
    rho_out: 1.0
    u0: 2.0            # rim speed at r = r0 (omega = u0 / r0)
    p: 1.0
    bx: 1.4104739588    # 5 / sqrt(4*pi)
    by: 0.0
    bz: 0.0
time: {dt_s: auto, steps: 4000, t_end: 0.15}
diagnostics: {output_path: out.npz, cadence: 0,
              fields: [rho, mx, my, mz, energy, bx, by, bz], divb: true}
boundary: {fluid: [outflow, outflow, outflow, outflow],
           field: [outflow, outflow, outflow, outflow]}
