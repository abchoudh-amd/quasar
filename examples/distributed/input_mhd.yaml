units: normalized
domain: {nx: 32, ny: 32, lx_m: 1.0, ly_m: 1.0,
         origin_x_m: 0.0, origin_y_m: 0.0}
geometry: cartesian
numerics: {gamma: 1.6666667, reconstruction: mp5, riemann: hlld,
           integrator: ssprk3, ct: fd_ct_christlieb,
           positivity: troubled_cell, rho_floor: 1e-8, p_floor: 1e-9,
           cfl: 0.1}
initial: {type: orszag_tang, params: {b0: 1.0}}
time: {dt_s: auto, steps: 8}
diagnostics: {output_path: out_mhd.npz, cadence: 2,
              fields: [rho, energy, bx, by, bz], divb: true}
boundary: {fluid: [periodic, periodic, periodic, periodic],
           field: [periodic, periodic, periodic, periodic]}
