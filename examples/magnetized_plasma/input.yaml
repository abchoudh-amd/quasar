units: SI
neutralizing_background: true
normalization: {reference_density_per_m3: 1.0e18, reference_species: electron}
domain: {nx: 64, ny: 64, lx_m: 1.0e-2, ly_m: 1.0e-2}
# Warm electrons in a uniform out-of-plane B (1 T) supplied by the bound uniform
# field evaluator. Particles gyrate at the cyclotron frequency; the deck exercises
# the SI -> internal-unit conversion together with a non-Biot-Savart evaluator.
external_field:
  evaluator: {type: uniform, B_T: [0.0, 0.0, 1.0]}
numerics: {fdtd_order: 2, shape: tsc, current_filter: []}
species:
  - name: electron
    charge_C: -1.602176634e-19
    mass_kg: 9.1093837015e-31
    n_particles: 16384
    initial:
      distribution: maxwellian_uniform
      density_per_m3: 1.0e18
      temperature_eV: 100.0
time: {dt_s: auto, steps: 256}
diagnostics: {output_path: out.npz, cadence: 8, fields: [bz], per_species: true}
