units: normalized
neutralizing_background: true
domain: {nx: 128, ny: 16, lx_m: 1.0, ly_m: 0.125}
numerics: {fdtd_order: 2, shape: cic, current_filter: []}
# Two counter-streaming cold electron beams along x. A common, resolved velocity
# perturbation seeds the k=2*pi/L current mode deterministically; the relative
# drift then drives its electrostatic two-stream growth. Velocities are in units
# of c. A fixed uniform background neutralizes the equilibrium electron charge.
species:
  - name: electron_beam_left
    charge_C: -1
    mass_kg: 1
    n_particles: 16384
    initial:
      distribution: maxwellian_uniform
      density_per_m3: 1.0
      temperature_eV: 0.0
      drift_v: [0.2, 0.0, 0.0]
      velocity_perturbation: {amplitude_v: [1.0e-6, 0.0, 0.0], mode: [1, 0]}
  - name: electron_beam_right
    charge_C: -1
    mass_kg: 1
    n_particles: 16384
    initial:
      distribution: maxwellian_uniform
      density_per_m3: 1.0
      temperature_eV: 0.0
      drift_v: [-0.2, 0.0, 0.0]
      velocity_perturbation: {amplitude_v: [1.0e-6, 0.0, 0.0], mode: [1, 0]}
time: {dt_s: auto, steps: 3200}
diagnostics: {output_path: out.npz, cadence: 8, fields: [ex], per_species: true}
