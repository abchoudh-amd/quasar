units: normalized
domain: {nx: 128, ny: 16, lx_m: 1.0, ly_m: 0.125}
# Same counter-streaming setup as two_stream, but with a binomial current filter
# (plus a compensation pass) to damp short-wavelength grid noise. Demonstrates the
# current-smoothing pipeline; the instability still grows, with cleaner spectra.
numerics:
  fdtd_order: 2
  shape: tsc
  current_filter:
    - {type: binomial, n_passes: 4}
    - {type: compensated_binomial, n_passes: 1}
species:
  - name: electron_beam_left
    charge_C: -1
    mass_kg: 1
    n_particles: 16384
    initial:
      distribution: maxwellian_uniform
      density_per_m3: 1.0
      temperature_eV: 0.0
      drift_v: [0.2, 0.0, 0.0]
  - name: electron_beam_right
    charge_C: -1
    mass_kg: 1
    n_particles: 16384
    initial:
      distribution: maxwellian_uniform
      density_per_m3: 1.0
      temperature_eV: 0.0
      drift_v: [-0.2, 0.0, 0.0]
time: {dt_s: auto, steps: 256}
diagnostics: {output_path: out.npz, cadence: 8, fields: [ex], per_species: true}
