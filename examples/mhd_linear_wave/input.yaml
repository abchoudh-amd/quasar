# Circularly-polarized Alfven wave (smooth) for measuring convergence order.
#
# A small-amplitude, circularly-polarized Alfven wave traveling along x in a
# fully periodic box. The wave is an exact nonlinear solution of ideal MHD: after
# an integer number of wave periods the profile returns EXACTLY to its initial
# state, so the L1 error against the initial condition measures the complete
# scheme's convergence. MP7 is seventh order in space, but under fixed-CFL
# refinement the third-order SSPRK temporal error eventually controls the
# coupled rate; this deck does not by itself isolate the spatial order.
#
# nx / ny are deliberately plain small integers. The convergence test rewrites
# nx to 16 -> 32 -> 64 (the exact solution is y-invariant, so it uses eight y
# cells) and checks both adjacent error ratios.
#
# Setup (standard CP Alfven wave, B0 along the propagation axis x):
#   rho = 1, p = 0.1, B0x = 1 (background along x)
#   transverse perturbations: dvy = -A sin(k x), dvz = -A cos(k x)
#                             dBy =  A sin(k x), dBz =  A cos(k x)   (vA = 1)
# with k = 2*pi / lx and amplitude A = 1e-3.  This remains a small exact CP
# wave while keeping convergence errors above accumulated float64 round-off.
# The physical formulas above are pointwise. Conserved transverse components,
# By face averages, and Bz cell averages are seeded with sinc(k*dx/2); the
# circularly-polarized total energy is constant and retains its full A^2 term.
#
# Wave speed vA = B0 / sqrt(rho) = 1, so one period T = lx / vA = 1.0; t_end is
# set to one full period.

units: normalized
domain: {nx: 32, ny: 32, lx_m: 1.0, ly_m: 1.0, origin_x_m: 0.0, origin_y_m: 0.0}
geometry: cartesian
numerics: {gamma: 1.6666667, reconstruction: mp7, riemann: hlld, integrator: ssprk3,
           ct: fd_ct_christlieb, positivity: troubled_cell, rho_floor: 1e-8, p_floor: 1e-9, cfl: 0.3}
initial:
  type: alfven_wave
  params:
    rho: 1.0
    p: 0.1
    b0: 1.0          # background field magnitude along the propagation axis (x)
    amplitude: 1.0e-3
    wavenumber: 1    # number of full wavelengths across lx
    polarization: circular
time: {dt_s: auto, steps: 1000, t_end: 1.0}
diagnostics: {output_path: out.npz, cadence: 0,
              fields: [rho, mx, my, mz, energy, bx, by, bz], divb: true}
boundary: {fluid: [periodic, periodic, periodic, periodic],
           field: [periodic, periodic, periodic, periodic]}
