# H+ / mu- plasma in the equatorial slice of a square-toroid magnet.
#
# Toroid axis = z_lab; PIC z=0 plane is the equatorial slice through
# the donut bore. PIC sees the bore as a ring in (x_pic, y_pic).
#
# Magnet = axisymmetric square-cross-section current sheets
#   + 16 discrete rectangular TF coils (1000 A each).
# Sheets give poloidal B (B_x, B_z); TF coils give toroidal
# B_phi ~ mu_0 N I / (2 pi R) ~ 0.032 T at R = R0.
# The PIC window covers the inner 90% of the bore so no Yee sample
# lies on an ideal zero-radius TF-coil filament (where B is singular).
#
# Particles are loaded into a 0.020 m square block
# centered on the right-side bore at (x, y) = (0.100,
# 0.000) m -- the toroid's half-width x half-height
# footprint. Total physical time = 1.000 us
# (3014902 CFL steps at dt ~ 3.317e-13 s).
#
# Regenerate with:
#   python examples/square_toroid_pic/build_yaml.py

units: SI

domain:
  nx: 128
  ny: 128
  lx_m: 0.036000
  ly_m: 0.036000
  origin_x_m: 0.082000
  origin_y_m: -0.018000

numerics:
  fdtd_order: 2
  shape: cic

external_field:
  evaluator:
    type: biot_savart
    conductors:
      # Top sheet (+phi), z = +a/2
      - name: top_sheet_00
        current_A: +15.62500000
        geometry:
          type: circular_loop
          center_xyz: [0.0, 0.0, +0.02000000]
          axis_xyz:   [0.0, 0.0, 1.0]
          radius_m: +0.08031250
          n_segments: 128

