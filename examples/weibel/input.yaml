units: normalized
domain: {nx: 64, ny: 64, lx_m: 1.0, ly_m: 1.0}
numerics: {fdtd_order: 4, shape: tsc, current_filter: []}
# Two counter-streaming electron populations drifting along +/-y. The temperature
# anisotropy / counter-streaming drives the Weibel instability, which grows a
# transverse magnetic field (Bz) from noise. Velocities are in units of c.
species:
  - name: electron_up
    charge_C: -1
    mass_kg: 1
    n_particles: 65536
    initial:
      distribution: maxwellian_uniform
      density_per_m3: 1.0
      temperature_eV: 0.0
      drift_v: [0.0, 0.3, 0.0]
  - name: electron_down
    charge_C: -1
    mass_kg: 1
    n_particles: 65536
    initial:
      distribution: maxwellian_uniform
      density_per_m3: 1.0
      temperature_eV: 0.0
      drift_v: [0.0, -0.3, 0.0]
time: {dt_s: auto, steps: 512}
diagnostics: {output_path: out.npz, cadence: 16, fields: [bz], per_species: true}
