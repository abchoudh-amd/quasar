units: normalized
domain: {nx: 64, ny: 64, lx_m: 1.0, ly_m: 1.0}
# A closed rectangular PEC cavity seeded with the Cartesian TM_11 Yee
# eigenmode. Ez is defined at integer time and Bx/By at t=-dt/2 from the
# fourth-order discrete Maxwell dispersion relation, so no incompatible
# travelling-wave transient is injected. Particles are specular so the deck
# also stays valid if species are added later.
boundary:
  field: {x_lo: pec, x_hi: pec, y_lo: pec, y_hi: pec}
  particle: {x_lo: specular, x_hi: specular, y_lo: specular, y_hi: specular}
numerics: {fdtd_order: 4, shape: cic, current_filter: []}
fields:
  initial: {type: seed_tm_cavity, component: Ez, mode: [1, 1], amplitude: 1.0}
time: {dt_s: auto, steps: 640}
diagnostics: {output_path: out.npz, cadence: 8, fields: [ez, bx, by], per_species: false}
